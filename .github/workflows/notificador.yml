name: Recordatorio Automatico
 
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab to test
 
permissions:
  contents: read
 
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
 
      - name: Revisa events.json y notifica
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 notify.py --file events.json --days 5
